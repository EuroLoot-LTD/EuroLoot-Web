name: Desktop packages
on:
  push:
    branches: ['work/retail-foundation']
  pull_request:
    branches: ['codex/euroloot-experience', 'main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build && npm test
      - run: python desktop/package.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: EuroLoot-${{ matrix.os }}
          path: artifacts/packages/*
          retention-days: 30
