
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | EuroLoot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #101218;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      text-align: center;
      background: #1b1e27;
      border: 1px solid #303542;
      border-radius: 16px;
    }

    .logo {
      margin: 0 0 10px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #6ee7a8;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #aeb4c2;
      line-height: 1.5;
    }

    .google-button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 9px;
      background: #6ee7a8;
      color: #101218;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .google-button:hover {
      background: #8af0b8;
    }

    .google-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .message {
      min-height: 22px;
      margin-top: 18px;
      color: #ffb4b4;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #aeb4c2;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1 class="logo">Euro<span>Loot</span></h1>
    <p class="subtitle">Sign in or create your EuroLoot account.</p>

    <button
      id="google-button"
      class="google-button"
      type="button"
    >
      Continue with Google
    </button>

    <p id="message" class="message" role="status"></p>

    <a class="back-link" href="../index.html">
      ← Back to EuroLoot
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      'https://gepavrbxsdjmmtvwwtdc.supabase.co',
      'sb_publishable_zJNUK33LL5YQOu0mKDBY0g_FglwQg6N'
    );

    const button = document.getElementById('google-button');
    const message = document.getElementById('message');

    button.addEventListener('click', async () => {
      button.disabled = true;
      message.textContent = 'Connecting to Google…';

      try {
        const { error } =
          await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo:
                'https://euroloot-ltd.github.io/EuroLoot-Web/'
            }
          });

        if (error) {
          throw error;
        }
      } catch (error) {
        message.textContent =
          'Sign-in failed: ' + error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
